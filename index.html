<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f1d3c4">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="aera">
    <meta name="format-detection" content="telephone=no">
    <title>aera · the aura of coffee</title>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700&family=Poppins:wght@300;400;500&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --m: #6b1217;
            --m2: #8a1d24;
            --bg: #f7efe4;
            --ink: #3a1214;
            --mute: #8a6a63;
            --sky1: #f1d3c4;
            box-sizing: border-box;
            padding-top: env(safe-area-inset-top, 0px);
            padding-bottom: env(safe-area-inset-bottom, 0px)
        }

        @media (prefers-color-scheme:dark) {
            :root:not([data-theme="light"]) {
                --bg: #1d0b0d;
                --ink: #f7efe4;
                --mute: #c9a8a0;
                --sky1: #4a1a1e;
                color-scheme: dark
            }
        }

        :root[data-theme="dark"] {
            --bg: #1d0b0d;
            --ink: #f7efe4;
            --mute: #c9a8a0;
            --sky1: #4a1a1e;
            color-scheme: dark
        }

        * {
            box-sizing: border-box;
            margin: 0
        }

        html,
        body {
            height: 100%
        }

        body {
            background: var(--bg);
            color: var(--ink);
            font-family: Poppins, system-ui, sans-serif;
            overflow: hidden;
            -webkit-tap-highlight-color: transparent
        }

        .view {
            position: absolute;
            inset: 0;
            transition: opacity .9s, transform 1.1s
        }

        /* landing */
        #landing {
            background: linear-gradient(var(--sky1), var(--bg) 70%);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
            text-align: center;
            overflow-y: auto
        }

        body.in #landing {
            opacity: 0;
            pointer-events: none;
            transform: scale(1.7)
        }

        .tag {
            font-size: 12px;
            letter-spacing: .3em;
            text-transform: uppercase;
            color: var(--mute)
        }

        #scene {
            width: min(440px, 100%);
            margin: 6px auto;
            overflow: visible
        }

        .cloud {
            animation: drift 24s linear infinite
        }

        .cloud.c2 {
            animation-duration: 32s;
            animation-delay: -13s
        }

        @keyframes drift {
            from {
                transform: translateX(-80px)
            }

            to {
                transform: translateX(520px)
            }
        }

        .awn {
            animation: sway 5s infinite ease-in-out;
            transform-origin: 50% 0
        }

        @keyframes sway {
            50% {
                transform: skewX(-1deg)
            }
        }

        .bulb {
            animation: glow 2.6s infinite alternate
        }

        @keyframes glow {
            from {
                opacity: .5
            }

            to {
                opacity: 1
            }
        }

        .steam {
            fill: none;
            stroke: #b79a92;
            stroke-width: 3;
            stroke-linecap: round;
            opacity: 0;
            animation: steam 3.2s infinite
        }

        .steam:nth-child(2) {
            animation-delay: 1s
        }

        .steam:nth-child(3) {
            animation-delay: 2s
        }

        @keyframes steam {
            0% {
                opacity: 0;
                transform: translateY(8px)
            }

            30% {
                opacity: .8
            }

            100% {
                opacity: 0;
                transform: translateY(-22px)
            }
        }

        #door {
            transform-origin: 0 50%;
            transform-box: fill-box;
            transition: transform 1s cubic-bezier(.6, 0, .3, 1)
        }

        body.opening #door {
            transform: perspective(300px) rotateY(-78deg)
        }

        .person {
            animation: bob 3s infinite ease-in-out
        }

        @keyframes bob {
            50% {
                transform: translateY(-3px)
            }
        }

        .btn {
            margin-top: 10px;
            background: var(--m);
            color: #fff;
            border: 0;
            border-radius: 99px;
            padding: 15px 42px;
            font: 500 16px Poppins;
            letter-spacing: .14em;
            cursor: pointer;
            animation: pulse 2s infinite
        }

        .btn:active {
            transform: scale(.96)
        }

        @keyframes pulse {

            0%,
            100% {
                box-shadow: 0 8px 20px -8px var(--m)
            }

            50% {
                box-shadow: 0 8px 36px 0 var(--m2)
            }
        }

        .hint {
            margin-top: 14px;
            font-size: 12px;
            color: var(--mute)
        }

        .hint a {
            color: var(--m2);
            text-decoration: none
        }

        /* POV interior */
        #inside {
            background: #d8c9b0;
            opacity: 0;
            pointer-events: none;
            touch-action: pan-y;
            user-select: none
        }

        body.in #inside {
            opacity: 1;
            pointer-events: auto
        }

        #stage {
            position: absolute;
            inset: 0;
            perspective: 800px;
            perspective-origin: 50% 50%;
            overflow: hidden
        }

        #look,
        #world {
            position: absolute;
            inset: 0;
            transform-style: preserve-3d
        }

        #world {
            transition: transform 2.2s cubic-bezier(.55, 0, .25, 1)
        }

        #look {
            animation: look 9s infinite ease-in-out
        }

        @keyframes look {
            50% {
                transform: rotateY(2.2deg)
            }
        }

        #look.walk {
            animation: walkbob .8s infinite ease-in-out
        }

        @keyframes walkbob {
            50% {
                transform: translateY(6px)
            }
        }

        #look.sit {
            animation: none
        }

        .p {
            position: absolute;
            left: 50%;
            top: 50%
        }

        .brick {
            background: linear-gradient(rgba(80, 55, 30, .35), rgba(80, 55, 30, 0) 40%, rgba(80, 55, 30, .12)), var(--brick) 0 0/120px 72px, #efe6d6
        }

        .wp {
            position: absolute
        }

        .cur {
            position: absolute;
            left: 0;
            right: 0;
            bottom: 0;
            height: 46%;
            background: repeating-linear-gradient(90deg, #f4ead8 0 14px, #e3d2b6 14px 20px);
            border-bottom: 6px double #c8b08c;
            box-shadow: 0 6px 10px rgba(0, 0, 0, .25)
        }

        .cur:before {
            content: "";
            position: absolute;
            left: -8px;
            right: -8px;
            top: -3px;
            height: 4px;
            background: #b8894a
        }

        .bulb2 {
            display: block;
            margin: -8px auto 0;
            width: 22px;
            height: 28px;
            border-radius: 50% 50% 50% 50%/40% 40% 60% 60%;
            background: radial-gradient(#fff6d0, #ffc46b);
            box-shadow: 0 0 40px 18px rgba(255, 190, 100, .6);
            animation: glow 3s infinite alternate
        }

        .win {
            position: absolute;
            top: 70px;
            width: 300px;
            height: 230px;
            border: 10px solid #f2e4d2;
            background: radial-gradient(ellipse at 20% 110%, rgba(90, 120, 70, .75) 0 30%, transparent 31%), radial-gradient(ellipse at 75% 115%, rgba(70, 105, 60, .75) 0 34%, transparent 35%), linear-gradient(#ffe9c4, #ffcf94);
            box-shadow: 0 0 90px 30px rgba(255, 200, 130, .55)
        }

        .win:before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(90deg, transparent 48%, #f2e4d2 48% 52%, transparent 52%), linear-gradient(transparent 48%, #f2e4d2 48% 52%, transparent 52%)
        }

        .shade {
            display: block;
            margin: 0 auto;
            width: 78px;
            height: 40px;
            border-radius: 78px 78px 8px 8px;
            background: #efe6d6;
            box-shadow: 0 22px 50px 16px rgba(255, 200, 120, .45)
        }

        .cord {
            width: 2px;
            background: #d9b99a;
            margin: 0 auto
        }

        .tag3d {
            font: 600 20px 'Playfair Display', serif;
            color: #6b5238;
            background: linear-gradient(#f4ede1, #e6d9c2);
            padding: 6px 16px;
            border-radius: 4px;
            white-space: nowrap;
            border: 2px solid #b89870;
            box-shadow: 0 8px 16px rgba(0, 0, 0, .5);
            text-align: center
        }

        .tag3d:before {
            content: "";
            position: absolute;
            left: 18%;
            right: 18%;
            bottom: 100%;
            height: 172px;
            border-left: 2px solid #d9b99a;
            border-right: 2px solid #d9b99a
        }

        .big {
            line-height: 1;
            filter: drop-shadow(0 8px 6px rgba(0, 0, 0, .45))
        }

        #vig {
            position: absolute;
            inset: 0;
            pointer-events: none;
            background: radial-gradient(ellipse at 50% 55%, transparent 40%, rgba(70, 50, 30, .45)), linear-gradient(rgba(255, 170, 90, .07), transparent 40%);
            z-index: 2
        }

        /* seated foreground */
        #fg {
            position: absolute;
            z-index: 3;
            left: -15%;
            right: -15%;
            bottom: 0;
            height: 46%;
            background: linear-gradient(#ecd8b4 0, #d9bf94 6%, #c4a67a 30%, #a98a60);
            border-radius: 50% 50% 0 0/18% 18% 0 0;
            box-shadow: 0 -18px 40px rgba(80, 55, 30, .4);
            transform: translateY(108%);
            transition: transform 1s cubic-bezier(.3, 1.1, .4, 1)
        }

        #fg:after {
            content: "";
            position: absolute;
            inset: 0;
            background: repeating-linear-gradient(90deg, rgba(0, 0, 0, .08) 0 3px, transparent 3px 46px);
            border-radius: inherit
        }

        #cw {
            position: absolute;
            z-index: 4;
            left: 50%;
            bottom: 4%;
            width: min(88vw, 430px);
            transform: translateX(-50%) translateY(130%) scale(.8);
            opacity: 0;
            transition: transform .8s cubic-bezier(.3, 1.5, .5, 1), opacity .5s;
            transform-origin: 50% 100%
        }

        body.seated #fg {
            transform: none
        }

        body.seated #cw {
            transform: translateX(-50%);
            opacity: 1;
            transition-delay: .35s
        }

        #card {
            max-height: 64vh;
            max-height: 64dvh;
            overflow-y: auto;
            background: #fffaf2;
            color: #3a1214;
            border-radius: 6px 6px 14px 14px;
            padding: 18px 18px 12px;
            border-top: 6px solid var(--m);
            box-shadow: 0 18px 40px rgba(0, 0, 0, .55);
            scrollbar-width: thin;
            transform: perspective(900px) rotateX(10deg);
            transform-origin: 50% 100%
        }

        #card h2 {
            font-family: 'Playfair Display', serif;
            font-size: 27px;
            color: var(--m);
            text-align: center
        }

        #card .note {
            font-size: 12px;
            text-align: center;
            color: #8a6a63;
            margin: 2px 0 10px;
            font-weight: 300
        }

        .it {
            display: flex;
            justify-content: space-between;
            gap: 10px;
            padding: 9px 0;
            border-bottom: 1px dashed #dcc7b6
        }

        .it:last-child {
            border: 0
        }

        .it b {
            font-weight: 500;
            font-size: 14px
        }

        .it p {
            font-size: 11.5px;
            color: #8a6a63;
            font-weight: 300
        }

        .it span {
            color: var(--m2);
            font-weight: 500;
            white-space: nowrap;
            font-size: 14px
        }

        body.seated .it {
            animation: up .5s both
        }

        @keyframes up {
            from {
                opacity: 0;
                transform: translateY(10px)
            }
        }

        .fp {
            position: absolute;
            top: -44px;
            font-size: 54px;
            line-height: 1;
            filter: drop-shadow(0 6px 4px rgba(0, 0, 0, .5));
            animation: float 3s infinite ease-in-out
        }

        .fp.l {
            left: -8px
        }

        .fp.r {
            right: -8px;
            animation-delay: -1.5s
        }

        @keyframes float {
            50% {
                transform: translateY(-5px)
            }
        }

        /* UI */
        .top {
            position: absolute;
            z-index: 6;
            top: env(safe-area-inset-top, 0px);
            left: 0;
            right: 0;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 14px;
            pointer-events: none
        }

        .top>* {
            pointer-events: auto
        }

        .top img {
            width: 46px;
            height: 46px;
            border-radius: 50%
        }

        .back {
            background: rgba(0, 0, 0, .35);
            border: 1px solid rgba(255, 255, 255, .3);
            color: #f7efe4;
            border-radius: 99px;
            padding: 7px 14px;
            font: 400 12px Poppins;
            cursor: pointer
        }

        #cap {
            position: absolute;
            z-index: 6;
            top: calc(env(safe-area-inset-top, 0px) + 70px);
            left: 0;
            right: 0;
            text-align: center;
            color: #5a4632;
            font-size: 12px;
            letter-spacing: .22em;
            text-transform: uppercase;
            text-shadow: 0 1px 8px rgba(255, 248, 235, .9);
            transition: opacity .4s
        }

        #sit {
            position: absolute;
            z-index: 6;
            left: 50%;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 62px);
            transform: translateX(-50%);
            opacity: 0;
            pointer-events: none;
            transition: opacity .6s
        }

        body.over #sit {
            opacity: 1;
            pointer-events: auto
        }

        .dots {
            position: absolute;
            z-index: 6;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
            left: 0;
            right: 0;
            display: flex;
            justify-content: center;
            gap: 8px
        }

        .dots button {
            width: 9px;
            height: 9px;
            border-radius: 9px;
            border: 0;
            background: rgba(90, 70, 50, .3);
            padding: 0;
            transition: .3s;
            cursor: pointer
        }

        .dots button.on {
            width: 26px;
            background: #5a4632
        }

        .swipe {
            position: absolute;
            z-index: 6;
            bottom: calc(env(safe-area-inset-bottom, 0px) + 32px);
            left: 0;
            right: 0;
            text-align: center;
            color: #5a4632;
            font-size: 11px;
            letter-spacing: .2em;
            opacity: 0;
            transition: opacity .5s;
            pointer-events: none
        }

        body.seated .swipe {
            opacity: .8;
            animation: nudge 1.8s infinite
        }

        @keyframes nudge {
            50% {
                transform: translateX(8px)
            }
        }

        .arr {
            position: absolute;
            z-index: 6;
            top: 45%;
            width: 42px;
            height: 42px;
            border-radius: 50%;
            border: 0;
            background: rgba(90, 70, 50, .45);
            color: #fff;
            font-size: 22px;
            cursor: pointer;
            display: none
        }

        @media (hover:hover) and (min-width:700px) {
            .arr {
                display: block
            }
        }

        .arr.p {
            left: 14px
        }

        .arr.n {
            right: 14px
        }

        @media (prefers-reduced-motion:reduce) {
            #look {
                animation: none !important
            }

            .fp {
                animation: none
            }
        }

        /* ===== phone-first (Android + iPhone) ===== */
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%
        }

        button,
        a {
            touch-action: manipulation
        }

        #inside {
            -webkit-user-select: none;
            -webkit-touch-callout: none
        }

        .dots button {
            position: relative
        }

        .dots button:after {
            content: "";
            position: absolute;
            inset: -14px -4px
        }

        /* Apply mobile-specific layout only on small screens */
        @media (max-width: 768px) {
            body {
                overscroll-behavior: none
            }

            #landing {
                padding: max(20px, env(safe-area-inset-top, 20px)) 20px max(20px, env(safe-area-inset-bottom, 20px))
            }

            #scene {
                max-height: 52dvh
            }

            .btn {
                min-height: 48px
            }

            .top {
                padding-left: max(14px, env(safe-area-inset-left, 14px));
                padding-right: max(14px, env(safe-area-inset-right, 14px))
            }

            .back {
                min-height: 40px;
                padding: 8px 16px;
                font-size: 13px
            }
        }

        @media (pointer:coarse) {
            .big {
                filter: none
            }

            .win {
                box-shadow: 0 0 36px 8px rgba(255, 200, 130, .45)
            }

            .shade {
                box-shadow: 0 18px 30px 8px rgba(255, 200, 120, .4)
            }

            .bulb2 {
                box-shadow: 0 0 24px 10px rgba(255, 190, 100, .55)
            }

            #card {
                box-shadow: 0 10px 24px rgba(0, 0, 0, .4)
            }
        }

        @media (orientation:landscape) and (max-height:500px) {
            #card {
                max-height: 54dvh
            }

            .fp {
                display: none
            }

            #cap {
                top: calc(env(safe-area-inset-top, 0px) + 56px);
                top: calc(constant(safe-area-inset-top, 0px) + 56px)
            }

            .top img {
                width: 36px;
                height: 36px
            }

            #fg {
                height: 38%
            }

            #cw {
                width: min(70vw, 430px);
                bottom: 2%
            }

            #scene {
                max-height: 42dvh
            }
        }
    </style>
</head>

<body>

    <section id="landing" class="view">
        <div class="tag">Welcome to</div>
        <svg id="scene" viewBox="0 0 440 340" role="img" aria-label="Animated aera café storefront">
            <g class="cloud">
                <ellipse cx="0" cy="40" rx="34" ry="12" fill="#fff" opacity=".7" />
                <ellipse cx="22" cy="32" rx="22" ry="12" fill="#fff" opacity=".7" />
            </g>
            <g class="cloud c2">
                <ellipse cx="0" cy="85" rx="28" ry="10" fill="#fff" opacity=".6" />
                <ellipse cx="18" cy="78" rx="18" ry="10" fill="#fff" opacity=".6" />
            </g>
            <rect x="50" y="120" width="340" height="190" rx="6" fill="#6b1217" stroke="#4a0c10" stroke-width="3" />
            <circle cx="220" cy="92" r="46" fill="#f7efe4" stroke="#4a0c10" stroke-width="3" />
            <image data-logo x="178" y="50" width="84" height="84" />
            <g class="awn">
                <path d="M40 138h360l-14 38H54z" fill="#f7efe4" />
                <path d="M40 138h45l-8 38H54zM130 138h45l-4 38h-45zM220 138h45l4 38h-45zM310 138h45l8 38h-45z"
                    fill="#a62a31" />
            </g>
            <path d="M60 182q80 22 160 0t160 0" stroke="#f7efe4" fill="none" stroke-width="1.5" opacity=".7" />
            <g class="bulb">
                <circle cx="100" cy="190" r="5" fill="#ffd36b" />
                <circle cx="140" cy="196" r="5" fill="#ffd36b" />
                <circle cx="180" cy="198" r="5" fill="#ffd36b" />
                <circle cx="220" cy="198" r="5" fill="#ffd36b" />
                <circle cx="260" cy="198" r="5" fill="#ffd36b" />
                <circle cx="300" cy="196" r="5" fill="#ffd36b" />
                <circle cx="340" cy="190" r="5" fill="#ffd36b" />
            </g>
            <rect x="72" y="210" width="110" height="80" rx="6" fill="#ffd9a0" stroke="#f7efe4" stroke-width="4" />
            <path d="M127 210v80M72 250h110" stroke="#f7efe4" stroke-width="3" />
            <g class="person">
                <circle cx="100" cy="256" r="7" fill="#5a2a20" />
                <rect x="92" y="264" width="16" height="24" rx="6" fill="#5a2a20" />
            </g>
            <rect x="258" y="210" width="110" height="80" rx="6" fill="#ffd9a0" stroke="#f7efe4" stroke-width="4" />
            <path d="M313 210v80M258 250h110" stroke="#f7efe4" stroke-width="3" />
            <path d="M285 266h28v12a10 10 0 0 1-10 10h-8a10 10 0 0 1-10-10z" fill="#fff" />
            <path d="M313 270h5a5 5 0 0 1 0 10h-5" fill="none" stroke="#fff" stroke-width="3" />
            <g>
                <path class="steam" d="M292 260q-5-8 0-14" />
                <path class="steam" d="M299 260q-5-8 0-14" />
                <path class="steam" d="M306 260q-5-8 0-14" />
            </g>
            <rect x="190" y="206" width="60" height="104" fill="#ffd36b" />
            <g id="door">
                <rect x="190" y="206" width="60" height="104" rx="4" fill="#3a0a0d" />
                <rect x="198" y="214" width="44" height="40" rx="3" fill="#ffd9a0" opacity=".85" />
                <circle cx="240" cy="262" r="3.5" fill="#ffd36b" />
            </g>
            <rect x="20" y="310" width="400" height="8" rx="4" fill="#3a1214" opacity=".4" />
            <rect x="30" y="284" width="22" height="26" rx="3" fill="#a5532e" />
            <path d="M41 284q-14-24-2-36 4 16 2 36zM41 284q12-22 4-38-8 14-4 38z" fill="#4f8a4c" />
            <rect x="388" y="284" width="22" height="26" rx="3" fill="#a5532e" />
            <path d="M399 284q-14-24-2-36 4 16 2 36zM399 284q12-22 4-38-8 14-4 38z" fill="#4f8a4c" />
        </svg>
        <button class="btn" id="go">EXPLORE</button>
        <div class="hint">Tap to step inside · <a href="https://www.instagram.com/theaerabhilai/" target="_blank"
                rel="noopener">@theaerabhilai</a></div>
    </section>

    <section id="inside" class="view">
        <div id="stage">
            <div id="look">
                <div id="world"></div>
            </div>
        </div>
        <div id="vig"></div>
        <div class="top"><img data-logo alt="aera"><button class="back" id="back">← Outside</button></div>
        <div id="cap"></div>

            setTimeout(() => { L.className = n < 0 ? '' : 'sit'; if (n < 0) document.body.classList.add('over'); else { render(n); document.body.classList.add('seated') } busy = false }, 2300)
        }
        $('#go').onclick = () => { document.body.classList.add('opening'); setTimeout(() => { document.body.classList.add('in'); idx = -2; busy = false; ui(); goto(-1) }, 900) };
        $('#sit').onclick = () => goto(0);
        $('#pv').onclick = () => goto(idx - 1); $('#nx').onclick = () => goto(idx + 1);
        $('#back').onclick = () => { document.body.classList.remove('in', 'opening', 'seated', 'over'); idx = -1; busy = false; L.className = ''; cam(0, 1100, 0) };
        addEventListener('keydown', e => { if (idx < -1) return; if (e.key === 'ArrowRight') goto(idx + 1); if (e.key === 'ArrowLeft') goto(idx - 1) });
        let sx = 0, sy = 0; const ins = $('#inside');
        ins.addEventListener('pointerdown', e => { sx = e.clientX; sy = e.clientY });
        ins.addEventListener('pointerup', e => { const dx = e.clientX - sx, dy = e.clientY - sy; if (Math.abs(dx) > 50 && Math.abs(dx) > Math.abs(dy) * 1.4) goto(idx + (dx < 0 ? 1 : -1)) });
    </script>
</body>
